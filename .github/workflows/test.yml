name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        # Avoid the macOS ARM runner pool's capacity-related cancellations.
        os: [ubuntu-latest, macos-15-intel]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: taskpack-integrity --help
      - run: python -I test_uuid_swap.py
      - run: python -m unittest discover -s tests -v
